{% extends "master.html" %}

{% block title %}
   Add Member
{% endblock %}

{% block content %}
   <h1 id="form-title">Add Member</h1>
<form method="post" id="member-form">
    {% csrf_token %}
    <label class="form-label">
        First Name:
        <input type="text" name="first_name" class="form-input" placeholder="Enter your first name" required>
    </label>
    <label class="form-label">
        Last Name:
        <input type="text" name="last_name" class="form-input" placeholder="Enter your last name" required>
    </label>
    <label class="form-label">
        Phone Number:
        <input type="text" name="phone_number" class="form-input" placeholder="Enter your phone number" required>
    </label>
    <label class="form-label">
        Joining Date:
        <input type="date" name="joining_date" class="form-input" required>
    </label>
    <button type="submit" id="submit-button">Submit</button>
</form>
{% endblock %}
